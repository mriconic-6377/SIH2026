<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GeoResilience AI — Complete 13 Technology Stack Banner</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 30px;
      background: #ffffff;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .banner-container {
      width: 1350px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="banner-container">
    <svg viewBox="0 0 1320 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Left: TECHNOLOGY STACK & Arrow -->
      <g transform="translate(10, 32)">
        <text x="0" y="22" font-size="20" font-weight="900" fill="#000000" letter-spacing="1">TECHNOLOGY</text>
        <text x="0" y="46" font-size="20" font-weight="900" fill="#000000" letter-spacing="1">STACK</text>
        <!-- Sleek Arrow -->
        <path d="M150 34 L210 34 M198 24 L210 34 L198 44" stroke="#000000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- 1. Python -->
      <g transform="translate(240, 20)">
        <circle cx="28" cy="28" r="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

        <circle cx="34" cy="39" r="1.5" fill="#ffffff"/>
        <text x="28" y="70" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b">Python</text>
      </g>

      <!-- 2. FastAPI -->
      <g transform="translate(325, 20)">
        <circle cx="28" cy="28" r="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <circle cx="28" cy="28" r="18" fill="#059669"/>
        <path d="M30 14 L19 30 L27 30 L25 42 L37 26 L29 26 Z" fill="#ffffff"/>
        <text x="28" y="70" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b">FastAPI</text>
      </g>

      <!-- 3. React 19 -->
      <g transform="translate(410, 20)">
        <circle cx="28" cy="28" r="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <ellipse cx="28" cy="28" rx="18" ry="6.5" stroke="#06b6d4" stroke-width="1.8" fill="none"/>
        <ellipse cx="28" cy="28" rx="18" ry="6.5" stroke="#06b6d4" stroke-width="1.8" fill="none" transform="rotate(60 28 28)"/>
        <ellipse cx="28" cy="28" rx="18" ry="6.5" stroke="#06b6d4" stroke-width="1.8" fill="none" transform="rotate(120 28 28)"/>
        <circle cx="28" cy="28" r="3.5" fill="#06b6d4"/>
        <text x="28" y="70" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b">React 19</text>
      </g>

      <!-- 4. TypeScript -->
      <g transform="translate(495, 20)">
        <circle cx="28" cy="28" r="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="12" y="12" width="32" height="32" rx="5" fill="#3178c6"/>
        <text x="28" y="35" text-anchor="middle" font-size="16" font-weight="900" fill="#ffffff" font-family="sans-serif">TS</text>
        <text x="28" y="70" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b">TypeScript</text>
      </g>

      <!-- 5. Vite -->

        <circle cx="28" cy="28" r="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

      <g transform="translate(665, 20)">

      <!-- 7. PyTorch -->
      <g transform="translate(750, 20)">
        <circle cx="28" cy="28" r="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <path d="M28 13 L38 23 A14 14 0 1 1 18 23 Z" fill="#ee4c2c"/>
        <circle cx="39" cy="16" r="3" fill="#ee4c2c"/>
        <circle cx="28" cy="30" r="7" fill="#ffffff"/>
        <text x="28" y="70" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b">PyTorch</text>
      </g>

      <!-- 8. NumPy -->
      <g transform="translate(835, 20)">
        <circle cx="28" cy="28" r="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

      <g transform="translate(920, 20)">

      <!-- 10. ISRO Cartosat-1 -->

      <!-- 11. NASA GPM -->
      <g transform="translate(1090, 20)">
        <circle cx="28" cy="28" r="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

      <!-- 12. LoRaWAN 868MHz -->
      <g transform="translate(1175, 20)">
        <circle cx="28" cy="28" r="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <path d="M17 28 Q28 16 39 28 M14 24 Q28 10 42 24 M20 32 Q28 22 36 32" stroke="#0284c7" stroke-width="2" stroke-linecap="round" fill="none"/>
        <circle cx="28" cy="37" r="3" fill="#dc2626"/>
        <text x="28" y="70" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e293b">LoRa 868MHz</text>
      </g>

      <!-- 13. NDMA CAP v1.2 -->
      <g transform="translate(1255, 20)">
        <circle cx="28" cy="28" r="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="15" y="14" width="26" height="28" rx="4" fill="#ef4444"/>
        <text x="28" y="27" text-anchor="middle" font-size="8.5" font-weight="900" fill="#ffffff">CAP</text>
        <text x="28" y="37" text-anchor="middle" font-size="7" font-weight="700" fill="#fee2e2">v1.2</text>
        <text x="28" y="70" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e293b">NDMA CAP</text>
      </g>
    </svg>
  </div>
</body>
</html>
